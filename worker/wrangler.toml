name = "zaitxmedia-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "zaitxmedia-db"
database_id = ""

[[kv_namespaces]]
binding = "CACHE"
id = ""

[vars]
ENVIRONMENT = "development"

[env.production]
vars = { ENVIRONMENT = "production" }
